<h2 style="margin:0 0 1rem;color:var(--navy-dark);">Edit entry &mdash; {{ category_label }}</h2>
<form method="post" action="{% url 'employee-note-edit' employee.pk category note.pk %}" onsubmit="return notesAjaxSubmit(event);">
    {% csrf_token %}
    <p>{{ form.date.label_tag }}{{ form.date }}</p>
    <p>{{ form.work_item_ref.label_tag }}{{ form.work_item_ref }}</p>
    <p>{{ form.description.label_tag }}{{ form.description }}</p>
    {% if form.errors %}<p style="color:#c0392b;">A description is required.</p>{% endif %}
    <p>
        <button class="btn" type="submit">Save</button>
        <button class="btn" type="button" style="background:#8a97a6;" onclick="loadNotesContent('{% url 'employee-notes' employee.pk category %}')">Cancel</button>
    </p>
</form>
